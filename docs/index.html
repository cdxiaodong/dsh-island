<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-island · 产品概念演示</title>
<style>
  :root{
    --bg:#e8ecf5; --bg2:#eef1fb; --bg3:#dce3f7;
    --brand:#4a5fa8; --brand2:#7f96d2; --brand3:#a5b7e2;
    --card:#ffffff; --line:#d6dae6; --txt:#1d2539; --dim:#6b738a;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,"PingFang SC",sans-serif;}
  html,body{height:100%;}
  body{background:linear-gradient(180deg,#eef1fb,#e8ecf5); color:var(--txt); display:flex; flex-direction:column; overflow:hidden;}

  /* 顶部导航 */
  .topbar{display:flex; align-items:center; gap:24px; padding:14px 28px; background:rgba(255,255,255,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(74,95,168,.08); z-index:10;}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand img{width:40px; height:28px; object-fit:contain;}
  .brand .bt{font-size:16px; font-weight:800; background:linear-gradient(90deg,#4a5fa8,#7f96d2); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .bs{font-size:10px; color:var(--dim); letter-spacing:1px;}
  .tabs{display:flex; gap:6px; margin-left:12px;}
  .tab{padding:9px 20px; font-size:13px; font-weight:700; color:var(--dim); border-radius:999px; cursor:pointer; border:1px solid transparent; transition:all .18s; white-space:nowrap;}
  .tab:hover{background:var(--bg2); color:var(--txt);}
  .tab.active{background:linear-gradient(90deg,#4a5fa8,#7f96d2); color:#fff; box-shadow:0 4px 12px rgba(74,95,168,.35);}
  .top-actions{margin-left:auto; display:flex; gap:10px;}
  .top-actions button{padding:8px 16px; font-size:12px; font-weight:700; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer; transition:all .15s;}
  .top-actions button:hover{background:var(--bg2);}

  /* 页面容器 */
  .pages{flex:1; position:relative; overflow:hidden;}
  .page{position:absolute; inset:0; overflow:auto; opacity:0; pointer-events:none; transition:opacity .3s;}
  .page.active{opacity:1; pointer-events:auto;}
  .page iframe{width:100%; height:100%; border:none; display:block;}
</style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="topbar">
    <div class="brand">
      <img src="assets/whale-half.png" alt="鲸鱼娘">
      <div><div class="bt">dsh-island</div><div class="bs">DEEPSEEK HARNESS · 灵动岛</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="go(0,this)">🌐 跨端互通</div>
      <div class="tab" onclick="go(1,this)">💬 DSH 对话联动</div>
      <div class="tab" onclick="go(2,this)">💼 价值对比</div>
      <div class="tab" onclick="go(3,this)">🗺️ 动态管理</div>
    </div>
    <div class="top-actions">
      <button onclick="exportCurrent()">📷 导出当前页</button>
    </div>
  </div>

  <!-- 分页 -->
  <div class="pages">
    <div class="page active" data-i="0"><iframe src="concept.html"></iframe></div>
    <div class="page" data-i="1"><iframe src="concept-dsh.html"></iframe></div>
    <div class="page" data-i="2"><iframe src="concept-value.html"></iframe></div>
    <div class="page" data-i="3"><iframe src="concept-remote.html"></iframe></div>
  </div>

<script>
  function go(i, el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
    document.querySelector('.page[data-i="'+i+'"]').classList.add('active');
  }
  function exportCurrent(){
    const active=document.querySelector('.page.active iframe');
    if(!active) return;
    // 调用子页自己的导出（若子页有 exportPNG）
    try{
      const w=active.contentWindow;
      if(typeof w.exportPNG==='function'){ w.exportPNG(); }
      else { alert('当前页无导出按钮，请在页面内点击"导出图片"，或用 Cmd+Shift+4 截图'); }
    }catch(e){ alert('请在页面内点击"导出图片"，或用 Cmd+Shift+4 截图'); }
  }
  // 键盘左右切换
  let cur=0;
  const TOTAL=4;
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      cur=(cur+(e.key==='ArrowRight'?1:-1)+TOTAL)%TOTAL;
      go(cur, document.querySelectorAll('.tab')[cur]);
    }
  });
</script>
</body>
</html>
